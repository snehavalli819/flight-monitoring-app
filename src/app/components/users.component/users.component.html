<mat-card class="users-container">

  <!-- HEADER -->
  <div class="users-header">

    <div>

      <h1>
        User Management
      </h1>

      <p>
        Manage users and access roles
      </p>

    </div>

    <button
      mat-raised-button
      color="primary"
      (click)="addUser()"
    >

      <mat-icon>
        person_add
      </mat-icon>

      Add User 

    </button>

  </div>

  <!-- FILTERS -->
  <div class="filters-section">

    <!-- SEARCH -->
    <div class="search-box">

      <mat-icon>
        search
      </mat-icon>

      <input
        type="text"
        placeholder="Search users..."
        [formControl]="searchControl"
      />

    </div>

    <!-- ROLE -->
    <mat-form-field appearance="outline">

      <mat-label>
        Role
      </mat-label>

      <mat-select
        (selectionChange)="
          updateRole(
            $event.value
          )
        "
      >

        <mat-option value="ALL">
          All
        </mat-option>

        <mat-option value="Supervisor">
          Supervisor
        </mat-option>

        <mat-option value="Controller">
          Controller
        </mat-option>

        <mat-option value="Viewer">
          Viewer
        </mat-option>

      </mat-select>

    </mat-form-field>

  </div>

  <!-- TABLE -->
  <div class="table-wrapper">

    <table
      mat-table
      [dataSource]="filteredUsers()"
      class="users-table"
    >

      <!-- USER -->
      <ng-container matColumnDef="user">

        <th mat-header-cell *matHeaderCellDef>
          User
        </th>

        <td mat-cell *matCellDef="let user">

          <div class="user-cell">

            <div class="avatar">

              {{
                user.name.charAt(0)
              }}

            </div>

            <div>

              <h4>
                {{ user.name }}
              </h4>

              <span>
                {{ user.email }}
              </span>

            </div>

          </div>

        </td>

      </ng-container>

      <!-- ROLE -->
      <ng-container matColumnDef="role">

        <th mat-header-cell *matHeaderCellDef>
          Role
        </th>

        <td mat-cell *matCellDef="let user">

          <div
            class="role-chip"
            [ngClass]="
              getRoleClass(
                user.role
              )
            "
          >

            {{ user.role }}

          </div>

        </td>

      </ng-container>

      <!-- STATUS -->
      <ng-container matColumnDef="status">

        <th mat-header-cell *matHeaderCellDef>
          Status
        </th>

        <td mat-cell *matCellDef="let user">

          <div
            class="status-chip"
            [ngClass]="
              getStatusClass(
                user.status
              )
            "
          >

            {{ user.status }}

          </div>

        </td>

      </ng-container>

      <!-- LOGIN -->
      <ng-container matColumnDef="lastLogin">

        <th mat-header-cell *matHeaderCellDef>
          Last Login
        </th>

        <td mat-cell *matCellDef="let user">

          {{ user.lastLogin }}

        </td>

      </ng-container>

      <!-- ACTIONS -->
      <ng-container matColumnDef="actions">

        <th mat-header-cell *matHeaderCellDef>
          Actions
        </th>

        <td mat-cell *matCellDef="let user">

          <button
            mat-icon-button
            [matMenuTriggerFor]="menu"
          >

            <mat-icon>
              more_vert
            </mat-icon>

          </button>

          <mat-menu #menu="matMenu">

            <button
              mat-menu-item
              (click)="
                editUser(user)
              "
            >

              <mat-icon>
                edit
              </mat-icon>

              Edit

            </button>

            <button
              mat-menu-item
              (click)="
                deleteUser(user)
              "
            >

              <mat-icon>
                delete
              </mat-icon>

              Delete

            </button>

          </mat-menu>

        </td>

      </ng-container>

      <!-- ROWS -->
      <tr
        mat-header-row
        *matHeaderRowDef="
          displayedColumns
        "
      ></tr>

      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns
        "
      ></tr>

    </table>

  </div>

</mat-card>
